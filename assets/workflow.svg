<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="t">codex-handoff workflow</title>
  <desc id="d">Swimlanes for user, commander and Codex. The commander plans and the user approves. The commander creates a handoff file and Codex runs one block. The commander reviews. P0/P1 findings go back to Codex via resume, at most three rounds, after which the user is consulted. Risky changes get a read-only Codex second opinion. When the review passes, the commander commits and summarizes into the plan, and the user triggers push or deploy.</desc>
  <style>
    :root {
      --bg: #ffffff; --edge: #d0d7de; --text: #1f2328; --muted: #59636e;
      --lane-u: #fff8e6; --lane-c: #eef1ff; --lane-x: #e7f7f4;
      --user: #b45309; --cmd: #4f46e5; --cx: #0f766e; --warn: #cf222e;
      --node: #ffffff; --flow: #8c959f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --edge: #30363d; --text: #e6edf3; --muted: #9198a1;
        --lane-u: #241c0c; --lane-c: #171a33; --lane-x: #0c2421;
        --user: #f2b25c; --cmd: #8b8cf8; --cx: #3dd6c1; --warn: #ff7b72;
        --node: #161b22; --flow: #6e7681;
      }
    }
    .card { fill: var(--bg); stroke: var(--edge); }
    .lane-u { fill: var(--lane-u); } .lane-c { fill: var(--lane-c); } .lane-x { fill: var(--lane-x); }
    .lane-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    .lane-sub { font-size: 10.5px; fill: var(--muted); }
    .node rect { fill: var(--node); stroke-width: 1.6; }
    .node text { font-size: 13px; font-weight: 600; fill: var(--text); text-anchor: middle; }
    .node .sub { font-size: 10.5px; font-weight: 400; fill: var(--muted); }
    .u rect { stroke: var(--user); } .c rect { stroke: var(--cmd); } .x rect { stroke: var(--cx); }
    .num { font-size: 10px; font-weight: 700; fill: var(--bg); text-anchor: middle; }
    .u .badge { fill: var(--user); } .c .badge { fill: var(--cmd); } .x .badge { fill: var(--cx); }
    .flow { fill: none; stroke: var(--flow); stroke-width: 1.8; stroke-dasharray: 6 5; animation: dash 1.2s linear infinite; marker-end: url(#arrow); }
    .flow.fix { stroke: var(--warn); marker-end: url(#arrow-warn); }
    .flow.opt { stroke-dasharray: 2 5; }
    .flow.stop { stroke: var(--warn); marker-end: url(#arrow-warn); stroke-dasharray: 3 4; animation-duration: 2s; }
    .elabel { font-size: 10.5px; fill: var(--muted); }
    .elabel.warn { fill: var(--warn); }
    .x rect { animation: glow 2.4s ease-in-out infinite; }
    .tok-main { fill: var(--cmd); } .tok-fix { fill: var(--warn); }
    .foot { font-size: 11px; fill: var(--muted); }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes glow { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .flow, .x rect { animation: none; } .token { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5534b"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="959" height="439" rx="14"/>

  <!-- lanes -->
  <rect class="lane-u" x="16" y="16" width="928" height="96" rx="10"/>
  <rect class="lane-c" x="16" y="120" width="928" height="170" rx="10"/>
  <rect class="lane-x" x="16" y="298" width="928" height="108" rx="10"/>
  <g class="lane-label">
    <text x="30" y="36" fill="var(--user)">用户</text>
    <text x="30" y="140" fill="var(--cmd)">指挥官</text>
    <text x="30" y="318" fill="var(--cx)">执行者 · Codex</text>
  </g>
  <text class="lane-sub" x="30" y="155">Claude Code / Antigravity / …</text>
  <text class="lane-sub" x="30" y="333">workspace-write 沙箱</text>

  <!-- edges (drawn under nodes) -->
  <path class="flow" d="M140 180 V68 H168"/>                      <!-- plan -> approve -->
  <path class="flow" d="M300 68 H330 V178"/>                      <!-- approve -> new -->
  <path class="flow" d="M330 230 V333"/>                          <!-- new -> run -->
  <path class="flow" d="M395 362 H460 V205 H493"/>                <!-- run -> review -->
  <path class="flow" d="M625 192 H753"/>                          <!-- review -> commit -->
  <text class="elabel" x="664" y="185">通过</text>
  <path class="flow" d="M820 178 V93"/>                           <!-- commit -> deploy -->
  <text class="elabel" x="828" y="140">用户口令</text>
  <path class="flow fix" d="M535 237 V333"/>                      <!-- review -> resume -->
  <path class="flow fix" d="M585 335 V239"/>                      <!-- resume -> review -->
  <text class="elabel warn" x="470" y="290">P0 / P1</text>
  <text class="elabel warn" x="592" y="290">再验</text>
  <path class="flow stop" d="M560 175 V93"/>                      <!-- review -> stop -->
  <text class="elabel warn" x="568" y="140">修复 2 轮仍不过</text>
  <path class="flow opt" d="M625 212 H745 V333"/>                 <!-- review -> 2nd opinion -->
  <path class="flow opt" d="M715 335 V228 H627"/>                 <!-- 2nd opinion -> review -->
  <text class="elabel" x="752" y="270">高风险改动</text>

  <!-- moving tokens -->
  <circle class="token tok-main" r="5.5">
    <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"
      path="M140 205 V68 H330 V360 H460 V205 H820 V68"/>
  </circle>
  <circle class="token tok-fix" r="4.5">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M535 237 V360 H585 V237 Z"/>
  </circle>

  <!-- user lane -->
  <g class="node u"><rect x="170" y="45" width="130" height="46" rx="10"/>
    <circle class="badge" cx="184" cy="59" r="8"/><text class="num" x="184" y="62.5">2</text>
    <text x="242" y="66">确认计划</text><text class="sub" x="242" y="81">批准这一块</text></g>
  <g class="node u"><rect x="480" y="45" width="160" height="46" rx="10" style="stroke:var(--warn)"/>
    <text x="560" y="66">停下找用户</text><text class="sub" x="560" y="81">多半是计划要改</text></g>
  <g class="node u"><rect x="755" y="45" width="130" height="46" rx="10"/>
    <circle class="badge" cx="769" cy="59" r="8"/><text class="num" x="769" y="62.5">8</text>
    <text x="827" y="66">push / 部署</text><text class="sub" x="827" y="81">只部署已提交版本</text></g>

  <!-- commander lane -->
  <g class="node c"><rect x="75" y="180" width="130" height="50" rx="10"/>
    <circle class="badge" cx="89" cy="194" r="8"/><text class="num" x="89" y="197.5">1</text>
    <text x="146" y="202">规划</text><text class="sub" x="146" y="218">写进 docs/plan.md</text></g>
  <g class="node c"><rect x="265" y="180" width="130" height="50" rx="10"/>
    <circle class="badge" cx="279" cy="194" r="8"/><text class="num" x="279" y="197.5">3</text>
    <text x="336" y="202">new 交接文件</text><text class="sub" x="336" y="218">仓库外 · 引用计划</text></g>
  <g class="node c"><rect x="495" y="175" width="130" height="62" rx="10"/>
    <circle class="badge" cx="509" cy="189" r="8"/><text class="num" x="509" y="192.5">5</text>
    <text x="566" y="198">复审</text><text class="sub" x="560" y="214">重跑验证 · 读 diff</text><text class="sub" x="560" y="228">P0 / P1 / P2</text></g>
  <g class="node c"><rect x="755" y="180" width="130" height="50" rx="10"/>
    <circle class="badge" cx="769" cy="194" r="8"/><text class="num" x="769" y="197.5">7</text>
    <text x="826" y="202">提交</text><text class="sub" x="826" y="218">按块 · 摘要回 plan</text></g>

  <!-- codex lane -->
  <g class="node x"><rect x="265" y="335" width="130" height="50" rx="10"/>
    <circle class="badge" cx="279" cy="349" r="8"/><text class="num" x="279" y="352.5">4</text>
    <text x="336" y="357">run 实施一块</text><text class="sub" x="336" y="373">结果追加回交接文件</text></g>
  <g class="node x"><rect x="495" y="335" width="130" height="50" rx="10"/>
    <circle class="badge" cx="509" cy="349" r="8"/><text class="num" x="509" y="352.5">6</text>
    <text x="566" y="357">resume 修复</text><text class="sub" x="560" y="373">续接会话 · ≤ 2 轮</text></g>
  <g class="node x"><rect x="695" y="335" width="140" height="50" rx="10" style="stroke-dasharray:4 3"/>
    <text x="765" y="357">review 第二意见</text><text class="sub" x="765" y="373">只读 · 可选</text></g>

  <text class="foot" x="30" y="426">同一时刻只有一个写手 · 一个任务只认一个指挥官 · 计划只有一份（docs/plan.md 或 Issue / PR）</text>
</svg>
